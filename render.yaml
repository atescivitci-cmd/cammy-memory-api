services:
  - type: web
    name: cammy-memory-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: QDRANT_URL
        value: https://cammy-qdrant.onrender.com
      # Secrets — set these in the Render dashboard, do not commit values.
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: MEMORY_API_KEY
        sync: false
